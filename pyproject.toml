[build-system]
requires = ["uv_build==0.8.19"]
build-backend = "uv_build"

[project]
name = "duckscout"
version = "0.1.0"
description = "A MicroDuck robot that searches for a target, approaches it, and stops."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.10.0",
    "numpy>=2,<3",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
]

[tool.uv]
exclude-newer = "1 day"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
